[package]
name = "xtask"
description = "Build tasks: release binaries with signed vaultorno statements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The daemon's own signature check, and the statement types without the
# sealing code.
vaultorno = { path = "../vaultorno" }
vaultorno_client = { path = "../vaultorno_client", default-features = false }
serde_json = "1"
sha2 = "0.10"
