[package]
name = "bulat"
version = "0.1.0"
edition = "2024"
default-run = "bulat"

[[bin]]
name = "bulat"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe"]

[dependencies]
# GUI (Optional)
egui = { version = "0.33.3", optional = true }
eframe = { version = "0.33.3", optional = true, features = ["persistence"] }

# Logic
logos = "0.16.1"
similar = "2.7.0"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }

# Scripting (if the Rhai loader lives inside bulat)
rhai = { version = "1.25.1", features = ["sync"] }
