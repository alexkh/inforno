# vaultorno's system users (design doc §14), for /usr/lib/sysusers.d/.
# The daemon's home is its state folder, so everything it keeps is under
# ~vaultorno.
u vaultorno          - "vaultorno daemon"    /var/lib/vaultorno  /usr/bin/nologin
u vaultorno_inspect  - "vaultorno inspector" -                   /usr/bin/nologin
