# vaultorno's system users (design doc §14), for /usr/lib/sysusers.d/.
# The daemon's home is its state folder, so everything it keeps is under
# ~vaultorno. The shell is left out, so systemd uses its own nologin path,
# which differs between distributions (/usr/bin on Arch, /usr/sbin on Debian).
u vaultorno          - "vaultorno daemon"    /var/lib/vaultorno
u vaultorno_inspect  - "vaultorno inspector"
