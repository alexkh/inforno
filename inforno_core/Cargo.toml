[package]
name = "inforno_core"
version = "0.1.0"
edition = "2024"

[dependencies]
bulat = { path = "../bulat" }
serde = { version = "1.0.228", features = ["derive"] }
indexmap = { version = "2.14.0", features = ["serde"] }
globset = "0.4.18"
toml = "1.1.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
openrouter-rs = "0.10.0"
ollama-rs = { version = "0.3.4", features = ["stream"] }
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["io-util"] }
directories = "6.0.0"
secrecy = "0.10.3"
chrono = "0.4.45"
regex = "1.12.4"
rhai = { version = "1.25.1", features = ["sync"] }
thiserror = "2.0.18"
strum = { version = "0.28.0", features = ["derive"] }
serde_json = "1.0.150"
futures-util = "0.3.32"
tracing = "0.1.44"
ron = "0.12.1"
serde-saphyr = "1.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.14.0"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["user", "mount", "sched", "process", "fs"] }
tempfile = "3.27.0"
